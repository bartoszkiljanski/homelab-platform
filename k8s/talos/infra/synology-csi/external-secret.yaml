apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synology-csi-client-info
  namespace: synology-csi
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore

  target:
    name: synology-csi-client-info
    creationPolicy: Owner

    template:
      engineVersion: v2
      data:
        client-info.yaml: |
          clients:
            - host: 10.250.0.2
              port: 5001
              https: true
              tlsServerName: lanlord-nas.synology.me
              username: "{{ .username }}"
              password: "{{ .password }}"

  data:
    - secretKey: username
      remoteRef:
        key: SYNOLOGY_CSI_USERNAME

    - secretKey: password
      remoteRef:
        key: SYNOLOGY_CSI_PASSWORD