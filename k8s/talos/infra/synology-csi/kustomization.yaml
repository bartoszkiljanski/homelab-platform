apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: synology-csi

resources:
  - external-secret.yaml
  - namespace.yaml

helmCharts:
  - name: synology-csi
    repo: https://christian-schlichtherle.github.io/synology-csi-chart
    version: 0.11.3
    releaseName: synology-csi
    namespace: synology-csi
    valuesFile: values.yaml