# Initial Terraform bootstrap values for Argo CD.
# Keep this file aligned with the future GitOps-managed Argo CD definition.
crds:
  install: true
  keep: true

configs:
  params:
    server.insecure: true
  cm:
    kustomize.buildOptions: "--enable-helm"
    url: https://argocd.home.lanlord.eu
    # Retain the built-in admin until Authentik SSO is proven and documented.
    admin.enabled: "true"
    oidc.config: |
      name: Authentik
      issuer: https://authentik.home.lanlord.eu/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-authentik-oidc:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - offline_access
      requestedIDTokenClaims:
        groups:
          essential: true
  rbac:
    policy.default: ""
    policy.csv: |
      g, ArgoCD Admins, role:admin
      g, Homelab Admins, role:admin
      g, ArgoCD Viewers, role:readonly
    scopes: '[groups]'

dex:
  enabled: false

server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

controller:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

repoServer:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
