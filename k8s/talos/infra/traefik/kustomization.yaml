apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

resources:
  # Traefik 3.7 supports Gateway API v1.5.1. Keep these CRDs in the same
  # Argo CD application so they are established before the Gateway objects.
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml
  - certificates/lanlord.eu.yaml

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.3.0
    kubeVersion: 1.36.3
    apiVersions:
      - policy/v1/PodDisruptionBudget
    releaseName: traefik
    namespace: traefik
    valuesFile: values.yaml
