apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-http-to-https
  namespace: traefik
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lan
      sectionName: web

  hostnames:
    - "*.home.lanlord.eu"
    - "home.lanlord.eu"

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301