deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik

providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    enabled: false

gateway:
  enabled: true
  name: lan
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      hostname: "*.home.lanlord.eu"
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - group: ''
          kind: Secret
          name: home-lanlord-eu-tls
service:
  labels:
    homelab.platform/exposure: lan
  annotations:
    lbipam.cilium.io/ips: "192.168.1.210"
  spec:
    type: LoadBalancer

ingressRoute:
  dashboard:
    enabled: false

log:
  level: INFO

accessLog:
  enabled: true

metrics:
  prometheus: null

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi
