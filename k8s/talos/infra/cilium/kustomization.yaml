apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - l2-announcement-policy.yaml
  - loadbalancer-ip-pool.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    version: 1.20.1
    releaseName: cilium
    namespace: kube-system
    includeCRDs: true
    valuesFile: values.yaml
