# Talos-specific Cilium bootstrap values.
# Keep this aligned with the pinned chart version used by the bootstrap process.
ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

l2announcements:
  enabled: true

# L2 announcement leases add API traffic. This comfortably covers the small
# number of LoadBalancer Services expected in this cluster.
k8sClientRateLimit:
  qps: 10
  burst: 20

# Restart agents when their rendered ConfigMap changes so GitOps configuration
# updates take effect without an imperative rollout command.
rollOutCiliumPods: true

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

bpf:
  # Talos host-DNS forwarding is not compatible with eBPF host routing.
  hostLegacyRouting: true

operator:
  replicas: 2

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
