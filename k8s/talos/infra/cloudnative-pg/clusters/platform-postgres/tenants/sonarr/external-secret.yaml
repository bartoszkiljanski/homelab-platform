apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore

  target:
    name: sonarr-postgres
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: sonarr
        password: "{{ .password }}"

  data:
    - secretKey: password
      remoteRef:
        key: SONARR_POSTGRES_PASSWORD
