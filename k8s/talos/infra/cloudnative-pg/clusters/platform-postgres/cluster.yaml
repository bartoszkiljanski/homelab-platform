apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  instances: 2

  plugins:
    - enabled: true
      name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: platform-postgres-b2

  storage:
    storageClass: synology-csi-iscsi-retain
    size: 20Gi