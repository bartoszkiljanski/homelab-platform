apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  instances: 2

  managed:
    roles:
      - name: authentik
        ensure: present
        comment: Authentik application role
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: authentik-postgres

  plugins:
    - enabled: true
      name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: platform-postgres-b2

  storage:
    storageClass: synology-csi-iscsi-retain
    size: 20Gi

  backup:
    target: prefer-standby
    volumeSnapshot:
      className: synology-csi-retain
      online: true
