apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  qbittorrent.yaml: |
    version: 1
    metadata:
      name: qBittorrent proxy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Homelab groups
          required: true

      - model: authentik_providers_proxy.proxyprovider
        id: qbittorrent-provider
        state: present
        identifiers:
          name: qBittorrent
        attrs:
          name: qBittorrent
          mode: proxy
          external_host: https://qbittorrent.home.lanlord.eu
          internal_host: http://qbittorrent-authentik-upstream.qbittorrent-vpn.svc.cluster.local:8081
          internal_host_ssl_validation: false
          intercept_header_auth: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: qbittorrent-application
        state: present
        identifiers:
          slug: qbittorrent
        attrs:
          name: qBittorrent
          slug: qbittorrent
          provider: !KeyOf qbittorrent-provider
          policy_engine_mode: any
          meta_launch_url: https://qbittorrent.home.lanlord.eu

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf qbittorrent-application
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, Homelab Admins]]
