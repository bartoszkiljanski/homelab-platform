apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-bazarr
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  bazarr.yaml: |
    version: 1
    metadata:
      name: Bazarr proxy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Homelab groups
          required: true

      - model: authentik_providers_proxy.proxyprovider
        id: bazarr-provider
        state: present
        identifiers:
          name: Bazarr
        attrs:
          name: Bazarr
          mode: proxy
          external_host: https://bazarr.home.lanlord.eu
          internal_host: http://servarr-bazarr.servarr.svc.cluster.local:6767
          internal_host_ssl_validation: false
          intercept_header_auth: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: bazarr-application
        state: present
        identifiers:
          slug: bazarr
        attrs:
          name: Bazarr
          slug: bazarr
          provider: !KeyOf bazarr-provider
          policy_engine_mode: any
          meta_launch_url: https://bazarr.home.lanlord.eu

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf bazarr-application
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, Homelab Admins]]
