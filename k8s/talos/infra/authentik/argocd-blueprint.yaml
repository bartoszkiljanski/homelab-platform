apiVersion: v1
kind: ConfigMap
metadata:
  # Preserve the original mount path so the existing file-backed blueprint
  # instance is updated in place instead of rediscovered under a new path.
  name: authentik-blueprints
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  argocd.yaml: |
    version: 1
    metadata:
      name: Argo CD OIDC
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Homelab groups
          required: true

      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        state: present
        identifiers:
          name: Argo CD
        attrs:
          name: Argo CD
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: argocd
          client_secret: !Env AUTHENTIK_ARGOCD_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
          redirect_uris:
            - url: https://argocd.home.lanlord.eu/auth/callback
              matching_mode: strict
            - url: http://localhost:8085/auth/callback
              matching_mode: strict

      - model: authentik_core.application
        id: argocd-application
        state: present
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          slug: argocd
          provider: !KeyOf argocd-provider
          policy_engine_mode: any
          meta_launch_url: https://argocd.home.lanlord.eu

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf argocd-application
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, ArgoCD Admins]]

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf argocd-application
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, Homelab Admins]]

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf argocd-application
          order: 2
        attrs:
          group: !Find [authentik_core.group, [name, ArgoCD Viewers]]
