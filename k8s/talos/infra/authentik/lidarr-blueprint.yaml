apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-lidarr
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  lidarr.yaml: |
    version: 1
    metadata:
      name: Lidarr proxy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Homelab groups
          required: true

      - model: authentik_providers_proxy.proxyprovider
        id: lidarr-provider
        state: present
        identifiers:
          name: Lidarr
        attrs:
          name: Lidarr
          mode: proxy
          external_host: https://lidarr.home.lanlord.eu
          internal_host: http://servarr-lidarr.servarr.svc.cluster.local:8686
          internal_host_ssl_validation: false
          intercept_header_auth: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: lidarr-application
        state: present
        identifiers:
          slug: lidarr
        attrs:
          name: Lidarr
          slug: lidarr
          provider: !KeyOf lidarr-provider
          policy_engine_mode: any
          meta_launch_url: https://lidarr.home.lanlord.eu

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf lidarr-application
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, Homelab Admins]]
