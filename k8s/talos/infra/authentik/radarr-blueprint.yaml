apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  radarr.yaml: |
    version: 1
    metadata:
      name: Radarr proxy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Homelab groups
          required: true

      - model: authentik_providers_proxy.proxyprovider
        id: radarr-provider
        state: present
        identifiers:
          name: Radarr
        attrs:
          name: Radarr
          mode: proxy
          external_host: https://radarr.home.lanlord.eu
          internal_host: http://servarr-radarr.servarr.svc.cluster.local:80
          internal_host_ssl_validation: false
          intercept_header_auth: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: radarr-application
        state: present
        identifiers:
          slug: radarr
        attrs:
          name: Radarr
          slug: radarr
          provider: !KeyOf radarr-provider
          policy_engine_mode: any
          meta_launch_url: https://radarr.home.lanlord.eu

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf radarr-application
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, Homelab Admins]]
