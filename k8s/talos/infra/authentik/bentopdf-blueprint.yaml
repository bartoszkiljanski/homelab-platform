apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-bentopdf
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  bentopdf.yaml: |
    version: 1
    metadata:
      name: BentoPDF proxy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Homelab groups
          required: true

      - model: authentik_providers_proxy.proxyprovider
        id: bentopdf-provider
        state: present
        identifiers:
          name: BentoPDF
        attrs:
          name: BentoPDF
          mode: proxy
          external_host: https://bentopdf.home.lanlord.eu
          internal_host: http://bentopdf.bentopdf.svc.cluster.local:8080
          internal_host_ssl_validation: false
          intercept_header_auth: true
          # BentoPDF registers this file as a service worker. Its background
          # update checks must not start a second OAuth flow during login.
          skip_path_regex: |-
            ^/sw\.js$
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: bentopdf-application
        state: present
        identifiers:
          slug: bentopdf
        attrs:
          name: BentoPDF
          slug: bentopdf
          provider: !KeyOf bentopdf-provider
          policy_engine_mode: any
          meta_launch_url: https://bentopdf.home.lanlord.eu

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf bentopdf-application
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, Homelab Admins]]

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf bentopdf-application
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, Homelab Users]]
