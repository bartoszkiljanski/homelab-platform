apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  sonarr.yaml: |
    version: 1
    metadata:
      name: Sonarr proxy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Homelab groups
          required: true

      - model: authentik_providers_proxy.proxyprovider
        id: sonarr-provider
        state: present
        identifiers:
          name: Sonarr
        attrs:
          name: Sonarr
          mode: proxy
          external_host: https://sonarr.home.lanlord.eu
          internal_host: http://servarr-sonarr.servarr.svc.cluster.local:80
          internal_host_ssl_validation: false
          intercept_header_auth: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: sonarr-application
        state: present
        identifiers:
          slug: sonarr
        attrs:
          name: Sonarr
          slug: sonarr
          provider: !KeyOf sonarr-provider
          policy_engine_mode: any
          meta_launch_url: https://sonarr.home.lanlord.eu

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf sonarr-application
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, Homelab Admins]]
