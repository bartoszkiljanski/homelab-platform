apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bitwarden-sdk-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-sdk-ca
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  isCA: true
  commonName: bitwarden-sdk-ca
  secretName: bitwarden-sdk-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: bitwarden-sdk-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bitwarden-sdk-ca
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  ca:
    secretName: bitwarden-sdk-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-sdk-server
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretName: bitwarden-tls-certs
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - bitwarden-sdk-server
    - bitwarden-sdk-server.external-secrets
    - bitwarden-sdk-server.external-secrets.svc
    - bitwarden-sdk-server.external-secrets.svc.cluster.local
  issuerRef:
    name: bitwarden-sdk-ca
    kind: Issuer
