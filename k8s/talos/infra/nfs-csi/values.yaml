kubeletDir: /var/lib/kubelet

controller:
  enableSnapshotter: false
  runOnControlPlane: true

externalSnapshotter:
  enabled: false

storageClasses:
  - name: synology-nfs-delete
    parameters:
      server: "10.250.0.2"
      share: /volume1/kubernetes
      subDir: "${pvc.metadata.namespace}/${pvc.metadata.name}/${pv.metadata.name}"
      mountPermissions: "0770"
      onDelete: delete
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
      - hard
      - noatime

  - name: synology-nfs-retain
    annotations:
      storageclass.kubernetes.io/is-default-class: "true"
    parameters:
      server: "10.250.0.2"
      share: /volume1/kubernetes
      subDir: "${pvc.metadata.namespace}/${pvc.metadata.name}/${pv.metadata.name}"
      mountPermissions: "0770"
      onDelete: retain
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
      - hard
      - noatime
