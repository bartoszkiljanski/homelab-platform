apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nfs-csi

resources:
  - namespace.yaml
  - storage/qbittorrent-media-pv.yaml
  - storage/servarr-media-pv.yaml

helmCharts:
  - name: csi-driver-nfs
    repo: https://kubernetes-csi.github.io/csi-driver-nfs
    version: 4.13.4
    releaseName: nfs-csi
    namespace: nfs-csi
    valuesFile: values.yaml
