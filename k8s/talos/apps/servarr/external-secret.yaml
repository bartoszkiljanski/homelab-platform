apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanuparr-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore

  target:
    name: cleanuparr-postgres
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: cleanuparr
        password: "{{ .password }}"

  data:
    - secretKey: password
      remoteRef:
        key: CLEANUPARR_POSTGRES_PASSWORD
