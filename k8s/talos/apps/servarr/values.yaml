x-arr-external-auth-init: &arrExternalAuthInit
  - name: configure-external-auth
    image: busybox:1.38.0
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    command:
      - /bin/sh
      - -ec
      - |
        config=/config/config.xml
        test -s "$config"

        methods="$(grep -c '<AuthenticationMethod>' "$config" || true)"
        external="$(grep -c '<AuthenticationMethod>External</AuthenticationMethod>' "$config" || true)"
        if [ "$methods" -eq 1 ] && [ "$external" -eq 1 ]; then
          exit 0
        fi

        umask 077
        temporary="$(mktemp /config/config.xml.XXXXXX)"
        trap 'rm -f "$temporary"' EXIT
        awk '
          /<AuthenticationMethod>.*<\/AuthenticationMethod>/ { next }
          /<\/Config>/ { print "  <AuthenticationMethod>External</AuthenticationMethod>" }
          { print }
        ' "$config" > "$temporary"
        grep -q '<AuthenticationMethod>External</AuthenticationMethod>' "$temporary"
        mv "$temporary" "$config"
        trap - EXIT
    volumeMounts:
      - name: config
        mountPath: /config

x-bazarr-external-auth-init: &bazarrExternalAuthInit
  - name: configure-external-auth
    image: busybox:1.38.0
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    command:
      - /bin/sh
      - -ec
      - |
        config=/config/config/config.yaml
        test -s "$config"

        current="$(awk '
          /^auth:[[:space:]]*$/ { in_auth=1; next }
          in_auth && /^[^[:space:]]/ { exit }
          in_auth && /^[[:space:]]+type:/ {
            sub(/^[[:space:]]+type:[[:space:]]*/, "")
            print
            exit
          }
        ' "$config")"
        [ "$current" = "null" ] && exit 0

        umask 077
        temporary="$(mktemp /config/config/config.yaml.XXXXXX)"
        trap 'rm -f "$temporary"' EXIT
        awk '
          /^auth:[[:space:]]*$/ { in_auth=1; print; next }
          in_auth && /^[^[:space:]]/ { in_auth=0 }
          in_auth && /^[[:space:]]+type:/ {
            sub(/type:.*/, "type: null")
            changed=1
          }
          { print }
          END { if (!changed) exit 1 }
        ' "$config" > "$temporary"
        mv "$temporary" "$config"
        trap - EXIT
    volumeMounts:
      - name: config
        mountPath: /config

jellyfin:
  enabled: true
  image:
    tag: 10.11.11ubu2604-ls46

  persistence:
    config:
      enabled: true
      storageClass: synology-nfs-retain
      accessMode: ReadWriteMany
      size: 10Gi
    media:
      enabled: true
      existingClaim: servarr-media
      accessMode: ReadWriteMany

  extraVolumeMounts:
    - name: media
      mountPath: /data

  extraInitContainers:
    - name: initialize-media-layout
      image: busybox:1.38.0
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - |
          mkdir -p \
            /data/downloads \
            /data/tv \
            /data/movies \
            /data/music \
            /data/torrents/tv \
            /data/torrents/movies \
            /data/torrents/music \
            /data/media/tv \
            /data/media/movies \
            /data/media/music
      volumeMounts:
        - name: media
          mountPath: /data

  extraEnvVars:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: TZ
      value: Europe/Warsaw
    - name: UMASK
      value: "002"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 4Gi

