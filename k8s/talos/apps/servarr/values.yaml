cleanuparr:
  enabled: true
  # Kept at zero only for the one-time SQLite to PostgreSQL cutover.
  replicaCount: 0
  image:
    tag: 2.10.3
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  env:
    BASE_PATH: ""
    DATABASE_PROVIDER: postgres
    PORT: "11011"
    POSTGRES_DB: cleanuparr
    POSTGRES_EXTRA_PARAMS: SSL Mode=Require;Trust Server Certificate=true
    POSTGRES_HOST: platform-postgres-rw.cloudnative-pg.svc.cluster.local
    POSTGRES_PORT: "5432"
    POSTGRES_USER: cleanuparr
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/Warsaw
    UMASK: "002"
  persistence:
    enabled: true
    storageClass: synology-nfs-retain
    accessMode: ReadWriteMany
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
