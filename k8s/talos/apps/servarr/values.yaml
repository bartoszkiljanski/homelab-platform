jellyfin:
  enabled: true

  persistence:
    config:
      enabled: true
      storageClass: synology-nfs-retain
      accessMode: ReadWriteMany
      size: 10Gi
    media:
      enabled: true
      existingClaim: servarr-media
      accessMode: ReadWriteMany

  extraVolumeMounts:
    - name: media
      mountPath: /data

  extraInitContainers:
    - name: initialize-media-layout
      image: busybox:1.38.0
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - |
          mkdir -p \
            /data/downloads \
            /data/tv \
            /data/movies \
            /data/music \
            /data/torrents/tv \
            /data/torrents/movies \
            /data/torrents/music \
            /data/media/tv \
            /data/media/movies \
            /data/media/music
      volumeMounts:
        - name: media
          mountPath: /data

  extraEnvVars:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: TZ
      value: Europe/Warsaw
    - name: UMASK
      value: "002"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 4Gi

sonarr:
  enabled: true
  image:
    tag: 4.0.19.2979-ls321
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/Warsaw
    UMASK: "002"
  persistence:
    enabled: true
    path: tv
    storageClass: synology-nfs-retain
    accessMode: ReadWriteMany
    size: 2Gi
    additionalMounts:
      - name: media
        mountPath: /data
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

