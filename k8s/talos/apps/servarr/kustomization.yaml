apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: servarr

resources:
  - storage/media-pvc.yaml

helmCharts:
  - name: servarr
    repo: https://charts.kubito.dev
    version: 1.5.2
    releaseName: servarr
    namespace: servarr
    valuesFile: values.yaml

# Chart 1.5.2 does not honor jellyfin.persistence.media.existingClaim for
# Cleanuparr's shared media volume.
patches:
  - target:
      kind: Deployment
      name: servarr-.*
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          spec:
            automountServiceAccountToken: false
  - target:
      kind: Deployment
      name: servarr-(lidarr|radarr|sonarr)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          spec:
            initContainers:
              - name: init-directories
                command:
                  - /bin/sh
                  - -ec
                  - >-
                    mkdir -p /media/downloads /media/tv /media/movies
                    /media/music /media/torrents/tv /media/torrents/movies
                    /media/torrents/music /media/media/tv
                    /media/media/movies /media/media/music
  - target:
      kind: Deployment
      name: servarr-cleanuparr
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: servarr-cleanuparr
      spec:
        template:
          spec:
            volumes:
              - name: media
                persistentVolumeClaim:
                  claimName: servarr-media
