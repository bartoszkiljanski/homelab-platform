apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: servarr

resources:
  - external-secret.yaml
  - httproutes.yaml
  - storage/media-pvc.yaml

helmCharts:
  - name: servarr
    repo: https://charts.kubito.dev
    version: 1.5.2
    releaseName: servarr
    namespace: servarr
    valuesFile: values.yaml

# Chart 1.5.2 does not honor jellyfin.persistence.media.existingClaim for
# Cleanuparr's shared media volume.
patches:
  # Temporary maintenance pause for the Prowlarr PostgreSQL cutover.
  - target:
      kind: Deployment
      name: servarr-prowlarr
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: servarr-prowlarr
      spec:
        replicas: 0
  - target:
      kind: Deployment
      name: servarr-.*
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          spec:
            automountServiceAccountToken: false
  - target:
      kind: Deployment
      name: servarr-(lidarr|radarr|sonarr)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          spec:
            initContainers:
              - name: init-directories
                command:
                  - /bin/sh
                  - -ec
                  - >-
                    mkdir -p /media/downloads /media/tv /media/movies
                    /media/music /media/torrents/tv /media/torrents/movies
                    /media/torrents/music /media/media/tv
                    /media/media/movies /media/media/music
  - target:
      kind: Deployment
      name: servarr-(lidarr|prowlarr|radarr|sonarr)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          spec:
            containers:
              - name: servarr
                startupProbe:
                  failureThreshold: 90
  - target:
      kind: Deployment
      name: servarr-cleanuparr
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: servarr-cleanuparr
      spec:
        template:
          spec:
            containers:
              - name: servarr
                env:
                  - name: POSTGRES_PASS
                    valueFrom:
                      secretKeyRef:
                        name: cleanuparr-postgres
                        key: password
            volumes:
              - name: media
                persistentVolumeClaim:
                  claimName: servarr-media
  - target:
      kind: Deployment
      name: servarr-lidarr
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: servarr-lidarr
      spec:
        template:
          spec:
            containers:
              - name: servarr
                env:
                  - name: Lidarr__Postgres__Password
                    valueFrom:
                      secretKeyRef:
                        name: lidarr-postgres
                        key: password
  - target:
      kind: Deployment
      name: servarr-radarr
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: servarr-radarr
      spec:
        template:
          spec:
            containers:
              - name: servarr
                env:
                  - name: Radarr__Postgres__Password
                    valueFrom:
                      secretKeyRef:
                        name: radarr-postgres
                        key: password
  - target:
      kind: Deployment
      name: servarr-sonarr
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: servarr-sonarr
      spec:
        template:
          spec:
            containers:
              - name: servarr
                env:
                  - name: Sonarr__Postgres__Password
                    valueFrom:
                      secretKeyRef:
                        name: sonarr-postgres
                        key: password
