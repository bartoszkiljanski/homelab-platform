apiVersion: batch/v1
kind: Job
metadata:
  name: qbittorrent-categories
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent-categories
        app.kubernetes.io/component: configuration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: configure
          image: linuxserver/qbittorrent:5.2.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              base_url=http://qbittorrent-vpn:8080
              cookie_jar=$(mktemp)
              trap 'rm -f "$cookie_jar"' EXIT

              until curl -fsS "$base_url/" >/dev/null; do
                sleep 2
              done

              response=$(curl -fsS \
                --cookie-jar "$cookie_jar" \
                --header "Referer: $base_url/" \
                --data-urlencode "username=$QBITTORRENT_USERNAME" \
                --data-urlencode "password=$QBITTORRENT_PASSWORD" \
                "$base_url/api/v2/auth/login")
              test "$response" = "Ok."

              set_category() {
                category=$1
                save_path=$2
                status=$(curl -sS \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --cookie "$cookie_jar" \
                  --header "Referer: $base_url/" \
                  --data-urlencode "category=$category" \
                  --data-urlencode "savePath=$save_path" \
                  "$base_url/api/v2/torrents/createCategory")
                case "$status" in
                  200|409) ;;
                  *) echo "Unable to create category $category: HTTP $status" >&2; exit 1 ;;
                esac

                curl -fsS \
                  --cookie "$cookie_jar" \
                  --header "Referer: $base_url/" \
                  --data-urlencode "category=$category" \
                  --data-urlencode "savePath=$save_path" \
                  "$base_url/api/v2/torrents/editCategory"
              }

              set_category sonarr /data/torrents/tv
              set_category radarr /data/torrents/movies
              set_category lidarr /data/torrents/music
          env:
            - name: QBITTORRENT_USERNAME
              value: admin
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui
                  key: password
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: temp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: temp
          emptyDir: {}
