replicaCount: 1

strategy:
  type: Recreate

qbittorrent:
  image:
    repository: linuxserver/qbittorrent
    tag: 5.2.3
    pullPolicy: IfNotPresent

  env:
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/Warsaw
    UMASK: "002"
    WEBUI_PORT: "8080"

  config:
    bootstrap:
      enabled: true
      config: |-
        [LegalNotice]
        Accepted=true

        [Preferences]
        Connection\UPnP=false
        Downloads\SavePath=/data/downloads/
        Downloads\TempPath=/data/downloads/incomplete/
        Downloads\TempPathEnabled=true
        WebUI\Address=*
        WebUI\LocalHostAuth=false
        WebUI\ServerDomains=*
        WebUI\UseUPnP=false

  persistence:
    config:
      enabled: true
      mountPath: /config
      storageClass: synology-nfs-retain
      accessModes:
        - ReadWriteMany
      size: 2Gi
    data:
      enabled: true
      mountPath: /data
      existingClaim: qbittorrent-media

  service:
    type: ClusterIP
    port: 8080

  startupProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 2

  livenessProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 6
    periodSeconds: 10
    timeoutSeconds: 2

  readinessProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 2

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

gluetun:
  enabled: true
  lifecycleMode: nativeSidecar

  image:
    repository: qmcgaw/gluetun
    tag: v3.41.1
    pullPolicy: IfNotPresent

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_ADMIN
    privileged: false
    seccompProfile:
      type: RuntimeDefault

  env:
    VPN_SERVICE_PROVIDER: protonvpn
    VPN_TYPE: wireguard
    PORT_FORWARD_ONLY: "on"
    VPN_PORT_FORWARDING: "on"
    FIREWALL_INPUT_PORTS: "8080"
    TZ: Europe/Warsaw

  envFrom:
    - secretRef:
        name: proton-vpn-wireguard

  startupProbe:
    httpGet:
      path: /
      port: 9999
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 2

  livenessProbe:
    httpGet:
      path: /
      port: 9999
    failureThreshold: 6
    periodSeconds: 10
    timeoutSeconds: 2

  readinessProbe:
    httpGet:
      path: /
      port: 9999
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 2

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

extraContainers:
  - name: port-forward-sync
    image: curlimages/curl:8.21.0
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 100
      runAsNonRoot: true
      runAsUser: 100
      seccompProfile:
        type: RuntimeDefault
    command:
      - /bin/sh
      - -ec
    args:
      - |
        last_port=""

        while true; do
          response="$(curl --fail --silent --show-error \
            http://127.0.0.1:8000/v1/openvpn/portforwarded 2>/dev/null || true)"
          port="$(printf '%s' "$response" | sed -n \
            's/.*"port"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p')"

          case "$port" in
            ""|*[!0-9]*)
              sleep 10
              continue
              ;;
          esac

          if [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
            sleep 10
            continue
          fi

          if [ "$port" != "$last_port" ] && \
            curl --connect-timeout 5 --max-time 10 \
              --fail --silent --show-error \
              http://127.0.0.1:8080/api/v2/app/version >/dev/null 2>&1; then
            curl --connect-timeout 5 --max-time 10 \
              --fail --silent --show-error \
              --request POST \
              --header 'Referer: http://127.0.0.1:8080' \
              --data-urlencode \
              "json={\"listen_port\":${port},\"random_port\":false,\"upnp\":false}" \
              http://127.0.0.1:8080/api/v2/app/setPreferences >/dev/null
            echo "qBittorrent listening port updated to ${port}"
            last_port="$port"
          fi

          sleep 30
        done
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 32Mi
    volumeMounts:
      - name: port-forward-sync-tmp
        mountPath: /tmp

volumes:
  - name: port-forward-sync-tmp
    emptyDir:
      sizeLimit: 16Mi
