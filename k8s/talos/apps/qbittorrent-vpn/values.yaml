replicaCount: 1

strategy:
  type: Recreate

qbittorrent:
  image:
    repository: linuxserver/qbittorrent
    tag: 5.2.3
    pullPolicy: IfNotPresent

  env:
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/Warsaw
    UMASK: "002"
    WEBUI_PORT: "8080"

  config:
    bootstrap:
      enabled: true
      config: |-
        [LegalNotice]
        Accepted=true

        [Preferences]
        Connection\UPnP=false
        Downloads\SavePath=/data/downloads/
        Downloads\TempPath=/data/downloads/incomplete/
        Downloads\TempPathEnabled=true
        WebUI\Address=*
        WebUI\LocalHostAuth=false
        WebUI\ServerDomains=*
        WebUI\UseUPnP=false

  persistence:
    config:
      enabled: true
      mountPath: /config
      storageClass: synology-nfs-retain
      accessModes:
        - ReadWriteMany
      size: 2Gi
    data:
      enabled: true
      mountPath: /data
      existingClaim: qbittorrent-media

  service:
    type: ClusterIP
    port: 8080

  startupProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 2

  livenessProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 6
    periodSeconds: 10
    timeoutSeconds: 2

  readinessProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 2

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

gluetun:
  enabled: true
  lifecycleMode: nativeSidecar

  image:
    repository: qmcgaw/gluetun
    tag: v3.41.1
    pullPolicy: IfNotPresent

  env:
    VPN_SERVICE_PROVIDER: protonvpn
    VPN_TYPE: wireguard
    PORT_FORWARD_ONLY: "on"
    VPN_PORT_FORWARDING: "on"
    VPN_PORT_FORWARDING_UP_COMMAND: >-
      /bin/sh -c 'wget -O- -nv --retry-connrefused
      --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
      http://127.0.0.1:8080/api/v2/app/setPreferences'
    VPN_PORT_FORWARDING_DOWN_COMMAND: >-
      /bin/sh -c 'wget -O- -nv --retry-connrefused
      --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
      http://127.0.0.1:8080/api/v2/app/setPreferences'
    FIREWALL_INPUT_PORTS: "8080,8081"
    TZ: Europe/Warsaw

  envFrom:
    - secretRef:
        name: proton-vpn-wireguard

  startupProbe:
    exec:
      command:
        - /gluetun-entrypoint
        - healthcheck
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 2

  livenessProbe:
    exec:
      command:
        - /gluetun-entrypoint
        - healthcheck
    failureThreshold: 6
    periodSeconds: 10
    timeoutSeconds: 2

  readinessProbe:
    exec:
      command:
        - /gluetun-entrypoint
        - healthcheck
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 2

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

extraContainers:
  - name: authentik-upstream
    image: haproxy:3.2-alpine
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 99
      runAsNonRoot: true
      runAsUser: 99
      seccompProfile:
        type: RuntimeDefault
    ports:
      - name: authentik
        containerPort: 8081
        protocol: TCP
    startupProbe:
      tcpSocket:
        port: authentik
      failureThreshold: 30
      periodSeconds: 2
    livenessProbe:
      tcpSocket:
        port: authentik
      failureThreshold: 3
      periodSeconds: 10
    readinessProbe:
      tcpSocket:
        port: authentik
      failureThreshold: 3
      periodSeconds: 10
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
    volumeMounts:
      - name: authentik-upstream-config
        mountPath: /usr/local/etc/haproxy/haproxy.cfg
        subPath: haproxy.cfg
        readOnly: true

volumes:
  - name: authentik-upstream-config
    configMap:
      name: qbittorrent-authentik-upstream
