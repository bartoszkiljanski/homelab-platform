apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 400Gi
  storageClassName: ""
  volumeMode: Filesystem
  volumeName: qbittorrent-media
