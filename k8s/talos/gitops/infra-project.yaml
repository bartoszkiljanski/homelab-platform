apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster infrastructure managed from the private homelab repository.
  sourceRepos:
    - git@github.com:bartoszkiljanski/homelab-platform.git
    - https://argoproj.github.io/argo-helm
    - https://helm.cilium.io/
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
